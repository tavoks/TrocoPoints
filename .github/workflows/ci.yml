name: CI/CD

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: "10.0.x"
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/trocopoints-api
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/trocopoints-worker

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore TrocoPoints.slnx

      - name: Build
        run: dotnet build TrocoPoints.slnx --no-restore --configuration Release

      # Testcontainers.Oracle sobe a própria imagem Oracle XE via Docker,
      # que já vem disponível nos runners ubuntu-latest - sem setup extra.
      - name: Test (unit + integration)
        run: dotnet test TrocoPoints.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  # Constrói UMA VEZ e publica no GHCR (registry de imagens do GitHub, grátis
  # pra repositórios públicos). Esse é o artefato que staging e produção vão
  # reusar - não rebuilda a imagem em cada ambiente, promove a mesma imagem
  # testada adiante. Só roda em push de verdade (não em PR - PR não deveria
  # poder publicar imagem).
  build-and-push:
    name: Build + Push imagens (GHCR)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag da imagem
        id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push imagem da Api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/TrocoPoints.Api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_API }}:${{ steps.vars.outputs.tag }}

      - name: Build + push imagem do Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/TrocoPoints.Worker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_WORKER }}:${{ steps.vars.outputs.tag }}

      # Numa tag v*, cria um "apelido" (mesmo digest, tag amigável) sem
      # rebuildar - é a mesma imagem já validada pelo sha, só com um nome
      # melhor pra promoção/rollback manual (docker pull .../trocopoints-api:v0.6.0).
      - name: Criar tag semver como alias (só em push de tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_API }}:${{ github.ref_name }} ${{ env.IMAGE_API }}:${{ steps.vars.outputs.tag }}
          docker buildx imagetools create -t ${{ env.IMAGE_WORKER }}:${{ github.ref_name }} ${{ env.IMAGE_WORKER }}:${{ steps.vars.outputs.tag }}

  # "Staging": dispara em todo push pra master. Ambiente k8s efêmero (kind)
  # dentro do runner - não é staging persistente de verdade (isso pediria um
  # cluster real na nuvem), mas simula a promoção: puxa a imagem que acabou
  # de ser publicada no GHCR (não builda de novo) e valida com smoke test.
  deploy-staging:
    name: Deploy staging (kind) + smoke test
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-and-smoke-test
        with:
          image-tag: ${{ needs.build-and-push.outputs.tag }}
          image-api: ${{ env.IMAGE_API }}
          image-worker: ${{ env.IMAGE_WORKER }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cluster-name: trocopoints-staging

  # "Produção": só dispara em tag v*, e só depois do staging passar - ou
  # seja, a MESMA imagem validada em staging é promovida, não uma nova
  # build. O ambiente "production" no GitHub precisa ter um "required
  # reviewer" configurado manualmente em Settings → Environments →
  # production (não dá pra configurar isso só pelo workflow.yml) - é o
  # gate manual que diferencia Continuous Delivery de Continuous
  # Deployment.
  deploy-production:
    name: Deploy production (kind) + smoke test
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-and-smoke-test
        with:
          image-tag: ${{ needs.build-and-push.outputs.tag }}
          image-api: ${{ env.IMAGE_API }}
          image-worker: ${{ env.IMAGE_WORKER }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cluster-name: trocopoints-production
