services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: trocopoints-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-TrocoPoints123}
      APP_USER: trocopoints
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-TrocoPoints123}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init-db:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  oracle-data:
