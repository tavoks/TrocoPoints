services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: trocopoints-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-TrocoPoints123}
      APP_USER: trocopoints
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-TrocoPoints123}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init-db:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    container_name: trocopoints-rabbitmq
    ports:
      - "5672:5672"   # protocolo AMQP (usado pela aplicação)
      - "15672:15672" # painel de administração (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-trocopoints}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-TrocoPoints123}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: trocopoints-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-trocopoints}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-TrocoPoints123}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: trocopoints-jaeger
    ports:
      - "16686:16686" # painel web (http://localhost:16686)
      - "4317:4317"   # OTLP gRPC (usado pela aplicação pra enviar traces)
      - "4318:4318"   # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  redis:
    image: redis:7-alpine
    container_name: trocopoints-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-TrocoPoints123}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-TrocoPoints123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oracle-data:
  rabbitmq-data:
  mongo-data:
  redis-data:
