services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: trocopoints-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-TrocoPoints123}
      APP_USER: trocopoints
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-TrocoPoints123}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init-db:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    container_name: trocopoints-rabbitmq
    ports:
      - "5672:5672"   # protocolo AMQP (usado pela aplicação)
      - "15672:15672" # painel de administração (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-trocopoints}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-TrocoPoints123}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oracle-data:
  rabbitmq-data:
