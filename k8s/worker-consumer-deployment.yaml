apiVersion: apps/v1
kind: Deployment
metadata:
  name: trocopoints-worker-consumer
  namespace: trocopoints
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trocopoints-worker-consumer
  template:
    metadata:
      labels:
        app: trocopoints-worker-consumer
    spec:
      containers:
        - name: worker
          image: trocopoints-worker:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: WORKER_ROLE
              value: "consumer"
          envFrom:
            - configMapRef:
                name: trocopoints-worker-config
            - secretRef:
                name: trocopoints-worker-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
