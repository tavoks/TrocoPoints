apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: trocopoints
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "trocopoints"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "TrocoPoints123"
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: trocopoints
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
